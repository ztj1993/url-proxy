# ==============================================================================
# url-proxy 统一配置文件 (proxy.conf)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 路径短别名路由 (Path Short Alias Routing - Feature 306)
# 客户端 sources.list 直接配置: deb http://<proxy>:8888/ubuntu jammy main
# ------------------------------------------------------------------------------
alias ubuntu http://archive.ubuntu.com/ubuntu
alias ubuntu-security http://security.ubuntu.com/ubuntu
alias debian https://deb.debian.org/debian
alias debian-security https://deb.debian.org/debian-security

# ------------------------------------------------------------------------------
# 2. 域名规则转发 (Host Forwarding - Feature 103)
# ------------------------------------------------------------------------------
forward registry-1.docker.io http://mirror.local/docker
forward github.com https://ghproxy.example.com

# ------------------------------------------------------------------------------
# 3. 缓存控制与白名单例外 (Cache Control & Whitelisting - Feature 305)
# 语法: cache/bypass <Scope> <Type> <Pattern>
# ------------------------------------------------------------------------------
# 白名单例外 (配置文件自主声明，强制落盘，优先级高于 bypass)
cache * suffix .deb
cache * suffix .udeb
cache * suffix .ddeb
cache * suffix .tar.gz
cache * suffix .tar.xz
cache * suffix .tar.zst
cache * suffix .tar.bz2
cache * suffix .dsc
cache * suffix .tgz

# APT 动态索引元数据免缓存 (纯流式透传，不落盘，彻底解决索引陈旧与 Hash 校验错误)
bypass /dists/ exact InRelease
bypass /dists/ exact Release
bypass /dists/ exact Release.gpg
bypass /dists/ prefix Packages
bypass /dists/ prefix Sources
bypass /dists/ prefix Translation-
bypass /dists/ regex ^.*/by-hash/.*$

# ------------------------------------------------------------------------------
# 4. PyPI 官方镜像源全链路闭环代理 (Feature 312)
# 客户端 pip 配置: pip install -i http://<proxy>:8888/pypi/simple/ --trusted-host <proxy>
# ------------------------------------------------------------------------------
alias pypi https://pypi.org
alias pythonhosted https://files.pythonhosted.org

# PEP 503 (HTML) 与 PEP 691 (JSON) 动态响应体重写
rewrite /pypi/simple/ type:pypi https://files.pythonhosted.org/ http://{PROXY_HOST}/pythonhosted/

# PyPI 动态索引免缓存 (纯流式透传，防版本陈旧)
bypass /pypi/simple/ *

# Python 二进制包与源码包强缓存
cache /pythonhosted/ suffix .whl
cache /pythonhosted/ suffix .tar.gz
cache /pythonhosted/ suffix .zip

# ------------------------------------------------------------------------------
# 5. npm 官方镜像源全链路闭环代理 (Feature 313)
# 客户端 npm 配置: npm config set registry http://<proxy>:8888/npm/
# ------------------------------------------------------------------------------
alias npm https://registry.npmjs.org

# npm JSON 元数据动态响应体重写 (Tarball URL 闭环重定向到本地代理)
rewrite /npm/ type:npm https://registry.npmjs.org/ http://{PROXY_HOST}/npm/

# npm 依赖压缩包强缓存
cache /npm/ suffix .tgz


