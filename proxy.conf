# ==============================================================================
# url-proxy 标准统一生产配置文件 (proxy.conf)
# 涵盖 8 大主流官方源生态: APT / Alpine / Go / Maven / PyPI / npm / Docker / Cargo
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 操作系统底层源 (Operating System Repositories: APT & Alpine)
# ------------------------------------------------------------------------------
# APT (Debian / Ubuntu)
# 客户端配置: deb http://<proxy>:8888/ubuntu jammy main
alias ubuntu http://archive.ubuntu.com/ubuntu
alias ubuntu-security http://security.ubuntu.com/ubuntu
alias debian https://deb.debian.org/debian
alias debian-security https://deb.debian.org/debian-security

# APT 动态索引元数据免缓存 (纯流式透传，严格支持 304 条件协商与 Hash 一致性)
bypass /ubuntu/dists/ prefix Packages
bypass /ubuntu/dists/ exact InRelease
bypass /ubuntu/dists/ exact Release
bypass /ubuntu/dists/ suffix .gpg
bypass /debian/dists/ prefix Packages
bypass /debian/dists/ exact InRelease
bypass /debian/dists/ exact Release
bypass /debian/dists/ suffix .gpg
bypass /dists/ prefix Packages
bypass /dists/ prefix Sources
bypass /dists/ prefix Translation-
bypass /dists/ exact InRelease
bypass /dists/ exact Release
bypass /dists/ exact Release.gpg
bypass /dists/ regex ^.*/by-hash/.*$

# APT 二进制包强缓存
cache /ubuntu/ suffix .deb
cache /ubuntu/ suffix .udeb
cache /debian/ suffix .deb
cache /debian/ suffix .udeb

# Alpine Linux (apk)
# 客户端配置: https://<proxy>:8888/alpine/v3.19/main
alias alpine https://dl-cdn.alpinelinux.org/alpine
bypass /alpine/ exact APKINDEX.tar.gz
cache  /alpine/ suffix .apk

# ------------------------------------------------------------------------------
# 2. 编译型语言依赖源 (Compiled Language Dependencies: Go & Maven)
# ------------------------------------------------------------------------------
# Go Modules (GOPROXY)
# 客户端配置: export GOPROXY="http://<proxy>:8888/goproxy,direct"
alias goproxy https://goproxy.cn
bypass /goproxy/ suffix /@v/list
cache  /goproxy/ suffix .zip
cache  /goproxy/ suffix .mod
cache  /goproxy/ suffix .info

# Maven Central
# 客户端配置: 在 settings.xml 中配置 mirrorOf=* 指向 http://<proxy>:8888/maven
alias maven https://repo1.maven.org/maven2
bypass /maven/ exact maven-metadata.xml
bypass /maven/ suffix maven-metadata.xml.sha1
bypass /maven/ contains -SNAPSHOT
cache  /maven/ suffix .jar
cache  /maven/ suffix .pom
cache  /maven/ suffix .aar

# ------------------------------------------------------------------------------
# 3. 动态应用层官方源 (Dynamic Application Registries: PyPI & npm)
# ------------------------------------------------------------------------------
# PyPI (Python)
# 客户端配置: pip install -i http://<proxy>:8888/pypi/simple/ --trusted-host <proxy>
alias pypi https://pypi.org
alias pythonhosted https://files.pythonhosted.org

# PEP 503 (HTML) 与 PEP 691 (JSON) 动态改写 Simple 索引中绝对 CDN 域名
rewrite /pypi/simple/ type:pypi https://files.pythonhosted.org/ http://{PROXY_HOST}/pythonhosted/

# PyPI 动态索引免缓存 (纯流式透传，防版本陈旧)
bypass /pypi/simple/ *

# Python 二进制包与源码包强缓存
cache /pythonhosted/ suffix .whl
cache /pythonhosted/ suffix .tar.gz
cache /pythonhosted/ suffix .zip

# npm (Node.js)
# 客户端配置: npm config set registry http://<proxy>:8888/npm/
alias npm https://registry.npmjs.org

# npm JSON 元数据动态改写 (Tarball URL 闭环重定向到本地代理)
rewrite /npm/ type:npm https://registry.npmjs.org/ http://{PROXY_HOST}/npm/

# npm 依赖压缩包强缓存
cache /npm/ suffix .tgz

# ------------------------------------------------------------------------------
# 4. 容器与现代化系统语言 (Container Images & Systems: Docker & Rust Cargo)
# ------------------------------------------------------------------------------
# Docker / OCI Registry v2
# 客户端配置: docker pull <proxy>:8888/docker/library/ubuntu:22.04
alias v2 https://registry-1.docker.io/v2
alias docker https://registry-1.docker.io

# Docker Registry 握手探测与 Manifest 元数据动态免缓存 (纯流式透传，防版本陈旧)
bypass /v2/ exact v2
bypass /v2/ exact index
bypass /v2/ contains /manifests/
bypass /docker/v2/ exact v2
bypass /docker/v2/ exact index
bypass /docker/v2/ contains /manifests/

# Docker 镜像分层 Layer Blob 强制本地永久落盘缓存 (SHA256 内容寻址不可变对象)
cache /v2/ contains /blobs/
cache /docker/v2/ contains /blobs/

# Rust Cargo (Sparse Index & Crates)
# 客户端配置: 在 ~/.cargo/config.toml 中配置 registry = "sparse+http://<proxy>:8888/crates-index/"
alias crates-index https://index.crates.io
alias crates-static https://static.crates.io

# config.json 动态响应体重写: 将 crates 下载端点闭环重定向至本地代理
rewrite /crates-index/config.json type:json https://static.crates.io/crates http://{PROXY_HOST}/crates-static/crates

# 稀疏索引元数据动态免缓存 (纯流式透传，严格支持 304 条件协商)
bypass /crates-index/ *

# Crates 源码包 100% 永久强缓存
cache /crates-static/ suffix .crate

# ------------------------------------------------------------------------------
# 5. 通用域名规则转发与全局扩展名白名单 (Host Forwarding & Global Whitelist)
# ------------------------------------------------------------------------------
forward registry-1.docker.io http://mirror.local/docker
forward github.com https://ghproxy.example.com

# 全局扩展名强缓存白名单兜底
cache * suffix .deb
cache * suffix .udeb
cache * suffix .ddeb
cache * suffix .apk
cache * suffix .whl
cache * suffix .tgz
cache * suffix .crate
cache * suffix .jar
cache * suffix .pom
cache * suffix .aar
cache * suffix .zip
cache * suffix .tar.gz
cache * suffix .tar.xz
cache * suffix .tar.zst
cache * suffix .tar.bz2
cache * suffix .dsc
