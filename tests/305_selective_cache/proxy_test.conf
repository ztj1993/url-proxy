# ==============================================================================
# Feature 305 测试专用统一配置文件 (proxy_test.conf)
# ==============================================================================

# 域名转发定义 (指向测试 mock_server 127.0.0.1:9995)
forward mirror.test http://127.0.0.1:9995

# 白名单保护规则 (最高优先级，强制落盘)
cache * suffix .deb
cache * suffix .tar.gz

# APT 动态元数据免缓存规则 (纯流式透传，绝不落盘)
bypass /dists/ exact InRelease
bypass /dists/ exact Release
bypass /dists/ prefix Packages
