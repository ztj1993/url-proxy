# ==============================================================================
# Feature 307 APT 全链路端到端集成测试配置 (proxy_test.conf)
# ==============================================================================

# 1. 路径短别名路由 (模拟内网私有源体验: deb http://proxy:8888/ubuntu jammy main)
alias ubuntu http://127.0.0.1:9997/ubuntu

# 2. 域名转发规则 (模拟官方镜像加速与前置网关重定向)
forward archive.ubuntu.com http://127.0.0.1:9997

# 3. 白名单保护规则 (最高优先级，强制落盘)
cache * suffix .deb
cache * suffix .udeb
cache * suffix .tar.gz
cache * suffix .tar.xz

# 4. APT 动态元数据免缓存规则 (纯流式透传，绝不落盘)
bypass /dists/ exact InRelease
bypass /dists/ exact Release
bypass /dists/ exact Release.gpg
bypass /dists/ prefix Packages
bypass /dists/ prefix Sources
bypass /dists/ prefix Translation-
bypass /dists/ regex ^.*/by-hash/.*$
