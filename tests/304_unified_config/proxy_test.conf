# ==============================================================================
# Feature 304 测试专用统一配置文件 (proxy_test.conf)
# ==============================================================================

# 1. 别名路由定义
alias test-ubuntu http://archive.ubuntu.com/ubuntu
alias test-debian http://deb.debian.org/debian

# 2. 域名转发定义 (指向测试 mock_server 127.0.0.1:9994)
forward example.internal http://127.0.0.1:9994/mirror
forward docker.internal http://127.0.0.1:9994/mirror

# 3. 白名单例外定义 (强制落盘)
cache * suffix .deb
cache * suffix .tar.gz

# 4. 免缓存动态资源定义
bypass /dists/ exact InRelease
bypass /dists/ prefix Packages
