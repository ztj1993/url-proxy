# ==========================================
# Feature 311 响应体重写测试配置
# ==========================================
alias /test-pypi http://127.0.0.1:9998/upstream/pypi
alias /test-npm  http://127.0.0.1:9998/upstream/npm

rewrite /test-pypi/simple/ type:pypi https://files.pythonhosted.org/ http://{PROXY_HOST}/pythonhosted/
rewrite /test-npm/         type:json https://registry.npmjs.org/     http://{PROXY_HOST}/npm/
rewrite /test-pypi/gzip/   type:html https://files.pythonhosted.org/ http://{PROXY_HOST}/pythonhosted/
