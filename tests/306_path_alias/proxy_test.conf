# ==============================================================================
# Feature 306 测试专用统一配置文件 (proxy_test.conf)
# ==============================================================================

# 1. 路径短别名路由定义 (指向测试 mock_server 127.0.0.1:9996)
alias my-ubuntu http://127.0.0.1:9996/upstream/ubuntu
alias my-debian http://127.0.0.1:9996/upstream/debian

# 2. 白名单保护规则 (最高优先级，强制落盘)
cache * suffix .deb

# 3. APT 动态元数据免缓存规则 (纯流式透传，绝不落盘)
bypass /dists/ exact InRelease
bypass /dists/ exact Release
