# ==============================================================================
# Feature 317: 路由作用域插件化与 Docker 分层缓存解耦测试配置
# ==============================================================================

# 1. 显式挂载 docker 插件的别名路由
alias docker http://127.0.0.1:9997/docker plugin:docker
alias v2     http://127.0.0.1:9997/v2     plugin:docker

# 2. 未挂载 docker 插件的通用/普通别名路由 (用于负向隔离测试)
alias plain   http://127.0.0.1:9997/plain
alias generic http://127.0.0.1:9997/generic

# 3. 镜像清单动态免缓存 (走 304 条件协商与动态透传)
bypass /docker/v2/ contains /manifests/
bypass /v2/        contains /manifests/

# 4. 分层落盘缓存
cache /docker/v2/ contains /blobs/
cache /v2/        contains /blobs/
cache /plain/     contains /blobs/
cache /generic/   contains /blobs/
