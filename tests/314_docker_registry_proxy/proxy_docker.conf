# ==============================================================================
# Feature 314: Docker / OCI 镜像 Registry v2 协议中继与分层缓存测试配置
# ==============================================================================
alias v2 http://127.0.0.1:9995/v2
alias docker http://127.0.0.1:9995

# Docker Registry 握手探测与 Manifest 元数据动态免缓存 (纯流式透传)
bypass /v2/ exact v2
bypass /v2/ exact index
bypass /v2/ contains /manifests/
bypass /docker/v2/ exact v2
bypass /docker/v2/ exact index
bypass /docker/v2/ contains /manifests/

# Docker 镜像分层 Layer Blob 强制本地永久落盘缓存
cache /v2/ contains /blobs/
cache /docker/v2/ contains /blobs/
