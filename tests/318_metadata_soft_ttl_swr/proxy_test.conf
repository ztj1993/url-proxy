# ==============================================================================
# Feature 318: 动态元数据软过期与 SWR 缓存测试配置
# ==============================================================================
alias pypi http://127.0.0.1:9998/pypi
alias npm  http://127.0.0.1:9998/npm
alias apt  http://127.0.0.1:9998/apt

# 1. 声明带软过期 (ttl:) 的 bypass 规则
bypass /pypi/ contains /simple/ ttl:2s
bypass /npm/  exact express     ttl:2s
bypass /apt/  exact InRelease   ttl:2s

# 2. 声明不带 ttl 的常规 bypass 规则 (对照组: 纯流式透传)
bypass /apt/ exact Packages
