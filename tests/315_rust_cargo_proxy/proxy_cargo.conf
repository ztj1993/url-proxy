# ==============================================================================
# Feature 315: Rust Cargo 稀疏索引与 Crates 官方源闭环代理测试配置
# ==============================================================================
alias /crates-index http://127.0.0.1:9994/crates-index
alias /crates-static http://127.0.0.1:9994/crates-static

# 声明 config.json 响应体重写 (闭环重定向至代理节点)
rewrite /crates-index/config.json type:json https://static.crates.io/crates http://{PROXY_HOST}/crates-static/crates

# 稀疏索引元数据免缓存 (纯流式透传)
bypass /crates-index/ *

# Crates 源码包强缓存
cache /crates-static/ suffix .crate
cache * suffix .crate
