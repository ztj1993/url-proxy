services:
  url-proxy:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    image: url-proxy:local-test
    container_name: url-proxy
    ports:
      - "8888:8888"
    volumes:
      - ./proxy.conf:/etc/url-proxy/proxy.conf:ro
    command: ["url-proxy", "-addr", ":8888", "-conf", "/etc/url-proxy/proxy.conf", "-cache", "/cache"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 1s
    restart: unless-stopped
    networks:
      - proxy-net

  # Mock Docker Registry v2 Service (Feature 314 & 317)
  mock-docker:
    image: url-proxy:local-test
    container_name: mock-docker
    command: ["mock-docker"]
    networks:
      - proxy-net

  # 1. APT - Prefix Mode (Package: tree)
  client-apt-prefix:
    image: docker.m.daocloud.io/library/ubuntu:24.04
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      bash -c "sed -i 's|http://archive.ubuntu.com/ubuntu|http://url-proxy:8888/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://url-proxy:8888/ubuntu-security|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true;
      apt-get -o Acquire::Retries=3 update && apt-get -o Acquire::Retries=3 download -y tree"
    networks:
      - proxy-net

  # 2. APT - Standard Forward Proxy Mode (Package: ed)
  client-apt-proxy:
    image: docker.m.daocloud.io/library/ubuntu:24.04
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      bash -c "echo 'Acquire::http::Proxy \"http://url-proxy:8888\";' > /etc/apt/apt.conf.d/01proxy;
      apt-get -o Acquire::Retries=3 update && apt-get -o Acquire::Retries=3 download -y ed"
    networks:
      - proxy-net

  # 3. Alpine - Prefix Mode (Package: tree)
  client-alpine-prefix:
    image: docker.m.daocloud.io/library/alpine:latest
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "echo 'http://url-proxy:8888/alpine/v3.20/main' > /etc/apk/repositories;
      apk update && apk fetch tree"
    networks:
      - proxy-net

  # 4. Alpine - Standard Forward Proxy Mode (Package: sed)
  client-alpine-proxy:
    image: docker.m.daocloud.io/library/alpine:latest
    depends_on:
      url-proxy:
        condition: service_healthy
    environment:
      http_proxy: "http://url-proxy:8888"
    command: >
      sh -c "echo 'http://mirrors.aliyun.com/alpine/v3.20/main' > /etc/apk/repositories;
      apk update && apk fetch sed"
    networks:
      - proxy-net

  # 5. PyPI - Prefix Mode (Package: six)
  client-pypi-prefix:
    image: docker.m.daocloud.io/library/python:3.11-alpine
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      pip install --no-cache-dir --index-url http://url-proxy:8888/pypi/simple/ --trusted-host url-proxy six
    networks:
      - proxy-net

  # 6. PyPI - Standard Forward Proxy Mode (Package: certifi)
  client-pypi-proxy:
    image: docker.m.daocloud.io/library/python:3.11-alpine
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      pip install --no-cache-dir --proxy http://url-proxy:8888 certifi
    networks:
      - proxy-net

  # 7. npm - Prefix Mode (Package: is-sorted)
  client-npm-prefix:
    image: docker.m.daocloud.io/library/node:20-alpine
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /tmp/app && cd /tmp/app && npm --registry http://url-proxy:8888/npm/ install is-sorted"
    networks:
      - proxy-net

  # 8. npm - Standard Forward Proxy Mode (Package: is-number)
  client-npm-proxy:
    image: docker.m.daocloud.io/library/node:20-alpine
    depends_on:
      url-proxy:
        condition: service_healthy
    environment:
      http_proxy: "http://url-proxy:8888"
      https_proxy: "http://url-proxy:8888"
      HTTP_PROXY: "http://url-proxy:8888"
      HTTPS_PROXY: "http://url-proxy:8888"
    command: >
      sh -c "mkdir -p /tmp/app && cd /tmp/app && npm --proxy http://url-proxy:8888 --https-proxy http://url-proxy:8888 install is-number"
    networks:
      - proxy-net

  # 9. Go - GOPROXY Mode (Package: pkg/errors)
  client-go-goproxy:
    image: docker.m.daocloud.io/library/golang:1.22-alpine
    depends_on:
      url-proxy:
        condition: service_healthy
    environment:
      GOPROXY: "http://url-proxy:8888/goproxy,direct"
      GONOSUMDB: "*"
    command: >
      sh -c "mkdir -p /tmp/go && cd /tmp/go && go mod init test && (go mod download github.com/pkg/errors@v0.9.1 || (sleep 1 && go mod download github.com/pkg/errors@v0.9.1))"
    networks:
      - proxy-net

  # 10. Go - Standard Forward Proxy Mode (Package: google/uuid)
  client-go-proxy:
    image: docker.m.daocloud.io/library/golang:1.22-alpine
    depends_on:
      url-proxy:
        condition: service_healthy
    environment:
      http_proxy: "http://url-proxy:8888"
      GOPROXY: "http://goproxy.cn,direct"
      GONOSUMDB: "*"
    command: >
      sh -c "mkdir -p /tmp/go && cd /tmp/go && go mod init test && (go mod download github.com/google/uuid@v1.6.0 || (sleep 1 && go mod download github.com/google/uuid@v1.6.0))"
    networks:
      - proxy-net

  # 11. Maven Central Repository Proxy (.jar package)
  client-maven:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      curl -s -f --retry 3 -o /tmp/slf4j-api.jar http://url-proxy:8888/maven/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar
    networks:
      - proxy-net

  # 12. Rust Cargo Crates Proxy (.crate package)
  client-cargo:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "(curl -s -f http://url-proxy:8888/crates-index/config.json || (sleep 2 && curl -s -f http://url-proxy:8888/crates-index/config.json)) | grep -q 'crates-static' &&
      (curl -s -f -o /tmp/serde.crate http://url-proxy:8888/crates-static/crates/serde/serde-1.0.197.crate || (sleep 2 && curl -s -f -o /tmp/serde.crate http://url-proxy:8888/crates-static/crates/serde/serde-1.0.197.crate))"
    networks:
      - proxy-net

  # 13. HTTP Range 206 Partial Content (Local Cache Slice Extraction)
  client-range:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "curl -s -f -o /dev/null http://url-proxy:8888/maven/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar &&
      curl -i -s -r 0-499 http://url-proxy:8888/maven/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar -D /tmp/range.hdr -o /tmp/range.bin &&
      grep -qi '206 Partial Content' /tmp/range.hdr &&
      grep -qi 'Content-Range: bytes 0-499/' /tmp/range.hdr &&
      grep -qi 'Content-Length: 500' /tmp/range.hdr &&
      [ -s /tmp/range.bin ]"
    networks:
      - proxy-net

  # 14. HTTP 304 Conditional Request (If-Modified-Since Short-Circuit)
  client-304:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "curl -s -D /tmp/h -o /dev/null http://url-proxy:8888/ubuntu-ttl/dists/noble/InRelease &&
      curl -s -D /tmp/h2 -o /dev/null -H 'If-Modified-Since: Fri, 01 Jan 2030 00:00:00 GMT' http://url-proxy:8888/ubuntu-ttl/dists/noble/InRelease &&
      grep -q 'HTTP/1.1 304' /tmp/h2"
    networks:
      - proxy-net

  # 15. Cache-HIT - Second Download & Bit-Identical Consistency (Feature 338 & 342)
  client-cache-hit:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "curl -s -D /tmp/cold.hdr -o /tmp/cold.jar http://url-proxy:8888/maven/org/slf4j/slf4j-simple/1.7.36/slf4j-simple-1.7.36.jar &&
      grep -q 'HTTP/1.1 200' /tmp/cold.hdr &&
      [ -s /tmp/cold.jar ] &&
      curl -s -D /tmp/warm.hdr -o /tmp/warm.jar http://url-proxy:8888/maven/org/slf4j/slf4j-simple/1.7.36/slf4j-simple-1.7.36.jar &&
      grep -q 'HTTP/1.1 200' /tmp/warm.hdr &&
      grep -iq 'X-Cache-Status: HIT' /tmp/warm.hdr &&
      cmp -s /tmp/cold.jar /tmp/warm.jar"
    networks:
      - proxy-net

  # 16. Anti-Pollution - Non-200 404 Zero-Disk & Stream-Through Guard (Feature 331)
  client-404-guard:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "CODE=$$(curl -s -w '%{http_code}' -o /dev/null http://url-proxy:8888/maven/nonexistent/fake-artifact-404.jar) &&
      [ $$CODE -eq 404 ]"
    networks:
      - proxy-net

  # 17. HEAD-Guard - HEAD Method Conversion & Anti-0-Byte Pre-warming (Feature 344)
  client-head-guard:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "curl -s -I http://url-proxy:8888/ubuntu-ttl/dists/jammy/InRelease -D /tmp/head.hdr -o /dev/null &&
      grep -q 'HTTP/1.1 200' /tmp/head.hdr &&
      sleep 2 &&
      curl -s -D /tmp/get.hdr -o /tmp/get.file http://url-proxy:8888/ubuntu-ttl/dists/jammy/InRelease &&
      grep -q 'HTTP/1.1 200' /tmp/get.hdr &&
      (grep -iq 'X-Cache-Status: HIT-DISK-TTL' /tmp/get.hdr || (sleep 2 && curl -s -D /tmp/get.hdr -o /tmp/get.file http://url-proxy:8888/ubuntu-ttl/dists/jammy/InRelease && grep -iq 'X-Cache-Status: HIT-DISK-TTL' /tmp/get.hdr)) &&
      [ -s /tmp/get.file ]"
    networks:
      - proxy-net

  # 18. Rewrite - Header Sanitization & Content-Length Precision (Feature 342)
  client-rewrite-guard:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "(curl -s -D /tmp/rw.hdr -o /tmp/rw.body http://url-proxy:8888/crates-index/config.json || (sleep 2 && curl -s -D /tmp/rw.hdr -o /tmp/rw.body http://url-proxy:8888/crates-index/config.json)) &&
      grep -q 'crates-static' /tmp/rw.body &&
      ! grep -iq '^ETag:' /tmp/rw.hdr &&
      ! grep -iq '^Digest:' /tmp/rw.hdr &&
      ! grep -iq '^Content-Encoding:' /tmp/rw.hdr &&
      ! grep -iq '^Accept-Ranges:' /tmp/rw.hdr &&
      [ -s /tmp/rw.body ] &&
      grep -iq '^Content-Length: ' /tmp/rw.hdr"
    networks:
      - proxy-net

  # 19. Disk-TTL - Fresh HIT & Client ETag Isolation (Features 332 & 343)
  client-ttl-guard:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "curl -s -D /tmp/ttl1.hdr -o /tmp/ttl1.body http://url-proxy:8888/ubuntu-ttl/dists/noble/InRelease &&
      grep -q 'HTTP/1.1 200' /tmp/ttl1.hdr &&
      [ -s /tmp/ttl1.body ] &&
      curl -s -H 'If-None-Match: bogus-etag-12345' -D /tmp/ttl2.hdr -o /tmp/ttl2.body http://url-proxy:8888/ubuntu-ttl/dists/noble/InRelease &&
      grep -q 'HTTP/1.1 200' /tmp/ttl2.hdr &&
      grep -iq 'X-Cache-Status: HIT-DISK-TTL' /tmp/ttl2.hdr &&
      cmp -s /tmp/ttl1.body /tmp/ttl2.body"
    networks:
      - proxy-net

  # 20. Docker / OCI Registry v2 Proxy & Layer Cache (Feature 314 & 317)
  client-docker:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
      mock-docker:
        condition: service_started
    command: >
      sh -c "curl -s -D /tmp/m.hdr -o /tmp/m.json -H 'Authorization: Bearer mock-docker-token' http://url-proxy:8888/docker-mock/v2/library/ubuntu/manifests/latest &&
      grep -q 'HTTP/1.1 200' /tmp/m.hdr &&
      grep -q 'schemaVersion' /tmp/m.json &&
      curl -s -L -D /tmp/b.hdr -o /tmp/b.layer -H 'Authorization: Bearer mock-docker-token' http://url-proxy:8888/docker-mock/v2/library/ubuntu/blobs/sha256:7b1a8c9e1234567890abcdef1234567890abcdef1234567890abcdef12345678 &&
      grep -q 'HTTP/1.1 200' /tmp/b.hdr &&
      [ -s /tmp/b.layer ]"
    networks:
      - proxy-net

  # 21. Singleflight - Concurrent Coalesced Download & Broadcast (Feature 201 & 338)
  client-singleflight:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "curl -s -o /tmp/f1.jar http://url-proxy:8888/maven/org/slf4j/slf4j-jdk14/1.7.36/slf4j-jdk14-1.7.36.jar &
      curl -s -o /tmp/f2.jar http://url-proxy:8888/maven/org/slf4j/slf4j-jdk14/1.7.36/slf4j-jdk14-1.7.36.jar &
      wait &&
      [ -s /tmp/f1.jar ] &&
      [ -s /tmp/f2.jar ] &&
      cmp -s /tmp/f1.jar /tmp/f2.jar"
    networks:
      - proxy-net

  # 22. SWR - 304 Revalidation & Lease Renewal (Feature 332 & 333)
  client-swr-guard:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "curl -s -D /tmp/cold.hdr -o /tmp/cold.file http://url-proxy:8888/ubuntu-swr/dists/focal/InRelease &&
      grep -q 'HTTP/1.1 200' /tmp/cold.hdr &&
      [ -s /tmp/cold.file ] &&
      sleep 3 &&
      curl -s -D /tmp/warm.hdr -o /tmp/warm.file http://url-proxy:8888/ubuntu-swr/dists/focal/InRelease &&
      grep -q 'HTTP/1.1 200' /tmp/warm.hdr &&
      grep -iq 'X-Cache-Status: REVALIDATED-304' /tmp/warm.hdr &&
      cmp -s /tmp/cold.file /tmp/warm.file"
    networks:
      - proxy-net

  # 23. Bypass-Guard - Dynamic Metadata Zero-Disk Verification (Feature 305 & 331)
  client-bypass-guard:
    image: url-proxy:local-test
    depends_on:
      url-proxy:
        condition: service_healthy
    command: >
      sh -c "curl -s -f -o /dev/null http://url-proxy:8888/ubuntu/dists/noble/Release &&
      curl -s -f -o /dev/null http://url-proxy:8888/alpine/v3.20/main/x86_64/APKINDEX.tar.gz &&
      curl -s -f -o /dev/null http://url-proxy:8888/maven/org/slf4j/slf4j-api/maven-metadata.xml &&
      curl -s -f -o /dev/null http://url-proxy:8888/pypi/simple/six/"
    networks:
      - proxy-net

networks:
  proxy-net:
    driver: bridge